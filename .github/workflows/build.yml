name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-28" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trucos
          path: build-*/*.levipack

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-*/*.levipack
